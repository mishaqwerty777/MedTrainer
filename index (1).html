  <style>

    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#173047 0,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:28px 18px;background:#0d141e;display:flex;flex-direction:column;gap:32px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#35d0b0,#3d8ef5);display:grid;place-items:center;color:#07131a;font-size:23px;font-weight:800}.brand strong{font-size:19px;letter-spacing:-.6px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.8px;margin-top:3px}.nav-label{font-size:10px;letter-spacing:1.5px;color:#64758b;padding:0 12px;margin-bottom:10px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#9eacc0;padding:12px;border-radius:11px;text-align:left;display:flex;align-items:center;gap:12px;font-size:13px}.nav button.active,.nav button:hover{background:#182637;color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--accent)}.nav .ico{width:20px;text-align:center;font-size:16px}.side-note{margin-top:auto;padding:16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#142638,#111a26)}.side-note b{font-size:12px}.side-note p{font-size:11px;color:var(--muted);line-height:1.55;margin:8px 0 0}.main{padding:32px clamp(20px,4vw,58px);max-width:1500px;width:100%;margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.crumb{font-size:12px;color:var(--muted)}.profile{display:flex;align-items:center;gap:10px;font-size:12px;color:#bdc9d8}.avatar{width:34px;height:34px;border-radius:50%;background:#20394a;border:1px solid #31546a;display:grid;place-items:center;color:var(--accent);font-weight:700}.eyebrow{font-size:11px;letter-spacing:1.8px;color:var(--accent);text-transform:uppercase;font-weight:700}.hero{display:flex;justify-content:space-between;align-items:center;gap:30px;margin-bottom:28px}.hero h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.7px;margin:10px 0 9px}.hero p{color:var(--muted);font-size:14px;line-height:1.6;margin:0;max-width:580px}.hero-art{width:150px;height:150px;flex:0 0 150px;border-radius:32px;background:linear-gradient(145deg,#173a45,#14233a);border:1px solid #285064;display:grid;place-items:center;font-size:68px;box-shadow:0 20px 60px #0005}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0 34px}.stat,.card{background:linear-gradient(145deg,#141f2c,#101823);border:1px solid var(--line);border-radius:17px}.stat{padding:17px 19px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:25px;margin-top:13px;letter-spacing:-.8px}.stat small{color:var(--muted);font-size:10px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 15px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.5px}.section-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.text-btn{border:0;background:transparent;color:var(--accent);font-size:11px}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.subject{padding:18px;cursor:pointer;transition:.18s;min-height:166px}.subject:hover{transform:translateY(-3px);border-color:#3d6973}.subject-icon{width:40px;height:40px;border-radius:12px;background:#1d3440;display:grid;place-items:center;font-size:20px;margin-bottom:16px}.subject h3{font-size:14px;margin:0 0 6px}.subject p{font-size:11px;color:var(--muted);margin:0 0 15px}.subject-foot{display:flex;justify-content:space-between;font-size:10px;color:#91a2b7}.progress{height:4px;border-radius:5px;background:#263448;margin-top:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);border-radius:5px}.continue{margin-top:28px;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:18px}.continue h3{font-size:14px;margin:0 0 6px}.continue p{font-size:11px;color:var(--muted);margin:0}.primary{border:0;border-radius:10px;background:var(--accent);color:#071a1b;font-weight:800;padding:12px 17px;font-size:12px}.primary:hover{filter:brightness(1.08)}.secondary{border:1px solid var(--line);border-radius:10px;background:#182434;color:var(--text);padding:11px 15px;font-size:12px}.page-title{font-size:29px;letter-spacing:-1px;margin:8px 0}.muted{color:var(--muted)}.subject-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.subject-row{padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer}.subject-row:hover{border-color:#3d6973}.subject-row .subject-icon{margin:0;flex-shrink:0}.subject-row h3{font-size:13px;margin:0 0 5px}.subject-row p{font-size:10px;color:var(--muted);margin:0}.arrow{margin-left:auto;color:var(--muted)}.quiz-wrap{max-width:780px;margin:0 auto}.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12px;color:var(--muted)}.quiz-progress{height:5px;background:#263448;border-radius:9px;margin-bottom:24px;overflow:hidden}.quiz-progress span{display:block;height:100%;background:var(--accent);transition:width .2s}.question-card{padding:clamp(20px,4vw,34px)}.question-card h2{font-size:20px;line-height:1.45;margin:13px 0 22px;letter-spacing:-.5px}.option{width:100%;display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);background:#131e2b;color:var(--text);border-radius:12px;padding:14px;margin:9px 0;font-size:13px;line-height:1.45}.option:hover{border-color:#4d7183}.option.selected{border-color:var(--blue);background:#182b42}.option.correct{border-color:var(--accent);background:#12352f}.option.wrong{border-color:var(--red);background:#3a202b}.letter{width:26px;height:26px;border:1px solid #3a4b60;border-radius:8px;display:grid;place-items:center;font-size:11px;color:#aab9ca;flex-shrink:0}.feedback{padding:13px 15px;border-radius:10px;margin-top:16px;font-size:12px;line-height:1.6}.feedback.good{background:#12352f;color:#9debd8}.feedback.bad{background:#3a202b;color:#ffb2bd}.quiz-actions{display:flex;justify-content:space-between;align-items:center;margin-top:22px}.result{text-align:center;padding:34px}.score-ring{width:130px;height:130px;border-radius:50%;border:8px solid #234a48;border-top-color:var(--accent);display:grid;place-items:center;margin:20px auto}.score-ring strong{font-size:34px}.result h2{font-size:25px}.result p{color:var(--muted);font-size:13px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.result-grid div{background:#182434;border-radius:12px;padding:14px}.result-grid b{display:block;font-size:20px}.result-grid small{font-size:10px;color:var(--muted)}.empty{padding:30px;color:var(--muted);font-size:13px}.mobile-brand{display:none}.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.mode-card{padding:22px;cursor:pointer;text-align:left;color:var(--text);transition:.18s}.mode-card:hover{border-color:var(--accent);transform:translateY(-2px)}.mode-card .mode-icon{font-size:27px;margin-bottom:14px}.mode-card h3{font-size:15px;margin:0 0 8px}.mode-card p{font-size:11px;line-height:1.6;color:var(--muted);margin:0 0 16px}.mode-card .mode-tag{font-size:10px;color:var(--accent)}.quiz-tools{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.quiz-tools span{border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:10px;color:var(--muted)}
    @media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:22px 18px 90px}.mobile-brand{display:flex;align-items:center;gap:9px;margin-bottom:23px}.mobile-brand .logo{width:32px;height:32px;font-size:19px}.mobile-brand strong{font-size:16px}.topbar{margin-bottom:25px}.hero-art{width:100px;height:100px;flex-basis:100px;font-size:45px;border-radius:24px}.subjects{grid-template-columns:repeat(2,1fr)}.subject-list{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:21px}.stat-top{font-size:9px}.continue{align-items:flex-start;flex-direction:column}.continue .primary{width:100%}}
    @media(max-width:480px){.hero-art{display:none}.subjects{grid-template-columns:1fr}.subject{min-height:0}.stats{grid-template-columns:repeat(3,1fr)}.stat strong{font-size:18px}.stat small{font-size:9px}.profile span{display:none}.hero h1{font-size:30px}}

<div class="app">

<script>
const surgeryQuestions = [
 {q:'Какой симптом наиболее характерен для острого аппендицита?',a:['Симптом Щёткина — Блюмберга','Симптом Ортнера','Миграция боли из эпигастрия в правую подвздошную область','Симптом Пастернацкого'],c:2,e:'Для острого аппендицита типична миграция боли из эпигастрия или околопупочной области в правую подвздошную область (симптом Кохера—Волковича).'},
 {q:'Какой микроорганизм чаще всего вызывает газовую гангрену?',a:['Staphylococcus aureus','Streptococcus pyogenes','Clostridium perfringens','Pseudomonas aeruginosa'],c:2,e:'Наиболее частый возбудитель клостридиальной мионекрозной инфекции — Clostridium perfringens.'},
 {q:'Какой симптом характерен для острого холецистита?',a:['Симптом Мерфи','Симптом Ровзинга','Симптом Образцова','Симптом Воскресенского'],c:0,e:'Симптом Мерфи: болезненность и прерывание вдоха при пальпации правого подреберья.'},
 {q:'Какое осложнение наиболее опасно при язвенной болезни желудка?',a:['Дуоденит','Гастрит','Пилороспазм','Перфорация язвы'],c:3,e:'Перфорация приводит к попаданию содержимого желудка в брюшную полость и развитию перитонита.'},
 {q:'Какой признак наиболее характерен для механической кишечной непроходимости?',a:['Постоянная тупая боль без перерывов','Изолированная боль в эпигастрии','Брадикардия как ранний симптом','Схваткообразная боль в животе'],c:3,e:'Для механической непроходимости типична схваткообразная боль, связанная с усиленной перистальтикой выше препятствия.'},
 {q:'Какой метод является основным для подтверждения пневмоторакса у стабильного пациента?',a:['ЭКГ','ФГДС','Спирометрия','Рентгенография органов грудной клетки'],c:3,e:'У стабильного пациента обычно выполняют рентгенографию грудной клетки; при необходимости используют УЗИ или КТ.'},
 {q:'Какой признак наиболее характерен для артериального кровотечения?',a:['Тёмная кровь вытекает равномерно','Кровь просачивается по всей поверхности раны','Алая кровь выбрасывается пульсирующей струёй','Кровотечение отсутствует при движении'],c:2,e:'Артериальная кровь обычно алая и может выбрасываться пульсирующей струёй синхронно с сердечными сокращениями.'},
 {q:'Какой препарат применяют для специфического лечения столбняка в составе комплексной терапии?',a:['Ацикловир','Атропин','Гепарин','Противостолбнячный человеческий иммуноглобулин'],c:3,e:'Иммуноглобулин нейтрализует ещё не связавшийся с нервной тканью токсин. Также необходимы хирургическая обработка раны и интенсивная поддерживающая терапия.'},
 {q:'Какой симптом характерен для острого панкреатита?',a:['Боль в правой подвздошной области','Опоясывающая боль в верхней половине живота','Боль только при мочеиспускании','Изолированная боль в левом подреберье после травмы'],c:1,e:'Для острого панкреатита характерна интенсивная боль в эпигастрии, нередко опоясывающего характера, часто с иррадиацией в спину.'},
 {q:'Какой признак наиболее типичен для перитонита?',a:['Доскообразное напряжение мышц передней брюшной стенки','Безболезненная пальпация живота','Изолированный зуд кожи','Усиление аппетита'],c:0,e:'Защитное напряжение мышц живота — важный признак раздражения брюшины, хотя его выраженность зависит от ситуации.'},
 {q:'Какой метод является наиболее информативным при подозрении на острый тромбоз глубоких вен нижней конечности?',a:['Рентгенография стопы','Дуплексное ультразвуковое сканирование вен','ЭКГ','Колоноскопия'],c:1,e:'Компрессионное дуплексное УЗИ вен — основной метод визуализации при подозрении на тромбоз глубоких вен.'},
 {q:'Какой вид шока наиболее вероятен при массивной острой кровопотере?',a:['Кардиогенный','Септический','Гиповолемический','Нейрогенный'],c:2,e:'При кровопотере уменьшается объём циркулирующей крови и венозный возврат, что вызывает гиповолемический шок.'},
 {q:'Какой признак характерен для ущемлённой грыжи?',a:['Грыжа свободно вправляется и не болит','Внезапная боль и невправимость грыжевого выпячивания','Уменьшение боли при кашле','Только кожный зуд'],c:1,e:'Внезапная боль, напряжение и невправимость ранее вправимого грыжевого выпячивания требуют экстренной хирургической оценки.'},
 {q:'Какой метод используют для первичной оценки свободной жидкости в брюшной полости у травмированного пациента?',a:['FAST-протокол УЗИ','ЭЭГ','Ректороманоскопия','Спирометрия'],c:0,e:'FAST — прикроватное ультразвуковое исследование для быстрого поиска свободной жидкости при травме.'},
 {q:'Что является приоритетом при открытом переломе конечности на догоспитальном этапе?',a:['Самостоятельно вправить отломки','Наложить стерильную повязку, иммобилизировать конечность и организовать транспортировку','Промыть рану концентрированным антисептиком','Разрешить нагрузку на конечность'],c:1,e:'Рану закрывают стерильной повязкой, конечность иммобилизируют; дальнейшая тактика включает срочную хирургическую обработку и профилактику инфекции по показаниям.'},
 {q:'Какой признак наиболее характерен для венозного кровотечения?',a:['Алая пульсирующая струя','Тёмная кровь вытекает непрерывным равномерным потоком','Кровь появляется только при кашле','Кровь не свёртывается никогда'],c:1,e:'Венозное кровотечение обычно характеризуется равномерным истечением тёмной крови без пульсации.'},
 {q:'Какое осложнение может развиться при остром аппендиците без своевременного лечения?',a:['Перфорация отростка и перитонит','Глаукома','Пневмосклероз','Отит'],c:0,e:'Прогрессирование воспаления может привести к некрозу и перфорации червеобразного отростка с развитием перитонита.'},
 {q:'Какой симптом характерен для острого холангита?',a:['Триада Шарко: боль в правом подреберье, лихорадка, желтуха','Триада Бека','Симптом Ласега','Триада Вирхова'],c:0,e:'Триада Шарко включает боль в правом подреберье, лихорадку/озноб и желтуху.'},
 {q:'Какой метод обычно применяют для диагностики желчнокаменной болезни на первом этапе?',a:['УЗИ органов брюшной полости','ЭЭГ','Рентгенография черепа','Бронхоскопия'],c:0,e:'УЗИ — основной первичный метод выявления конкрементов желчного пузыря.'},
 {q:'Что является важным ранним мероприятием при подозрении на острый хирургический живот?',a:['Назначить слабительное','Приложить грелку к животу','Организовать срочную медицинскую оценку; до осмотра не давать пищу и не применять тепло','Отложить обращение на сутки'],c:2,e:'Нужна срочная оценка. Самостоятельный приём пищи, слабительных и прогревание живота могут быть небезопасны.'}
 ];
const therapyQuestions = [
 {q:'Какой критерий наиболее характерен для артериальной гипертензии у взрослого при офисном измерении?',a:['АД ≥130/80 мм рт. ст. при одном измерении','АД ≥140/90 мм рт. ст. при повторных корректных измерениях','АД ≥120/70 мм рт. ст. после физической нагрузки','Любое повышение систолического АД выше 130 мм рт. ст.'],c:1,e:'Для офисной диагностики артериальной гипертензии используют порог ≥140/90 мм рт. ст. при корректных повторных измерениях. Для домашнего и суточного мониторирования пороги отличаются.'},
 {q:'Какой препарат относится к ингибиторам АПФ?',a:['Амлодипин','Бисопролол','Периндоприл','Индапамид'],c:2,e:'Периндоприл блокирует ангиотензинпревращающий фермент, уменьшая образование ангиотензина II и секрецию альдостерона.'},
 {q:'Какое изменение на ЭКГ наиболее типично для острого инфаркта миокарда с подъёмом ST?',a:['Подъём сегмента ST в смежных отведениях','Укорочение интервала PR','Изолированное увеличение зубца P','Депрессия сегмента PQ'],c:0,e:'Диагностически значимый подъём ST в смежных отведениях при соответствующей клинической картине требует немедленной оценки на ОКС с подъёмом ST.'},
 {q:'Какой биомаркер предпочтителен для подтверждения повреждения миокарда?',a:['АСТ','КФК общая','Высокочувствительный тропонин','Миоглобин как единственный тест'],c:2,e:'Сердечный тропонин I или T обладает высокой чувствительностью и специфичностью к повреждению миокарда. Результат оценивают в динамике и вместе с клиникой.'},
 {q:'Какой симптом наиболее характерен для левожелудочковой сердечной недостаточности?',a:['Ортопноэ и одышка','Изолированная боль в правом подреберье после еды','Полиурия без других симптомов','Боль в икроножных мышцах при ходьбе'],c:0,e:'Повышение давления в малом круге кровообращения вызывает застой в лёгких, одышку, ортопноэ и иногда приступы сердечной астмы.'},
 {q:'Какой аускультативный признак типичен для митрального стеноза?',a:['Диастолический шум на верхушке','Систолический шум над аортой с проведением на сонные артерии','Шум трения перикарда','Непрерывный шум над подключичной областью'],c:0,e:'Для митрального стеноза характерны хлопающий I тон, щелчок открытия митрального клапана и низкочастотный диастолический шум на верхушке.'},
 {q:'Какой ритм чаще всего выявляется при фибрилляции предсердий?',a:['Правильный ритм с постоянными интервалами RR','Нерегулярно-нерегулярный ритм без нормальных зубцов P','Синусовый ритм с укороченным PQ','Регулярная желудочковая тахикардия с широкими комплексами'],c:1,e:'При фибрилляции предсердий отсутствуют организованные зубцы P, а интервалы RR нерегулярны.'},
 {q:'Какой препарат обычно используют для контроля частоты желудочковых сокращений при фибрилляции предсердий у стабильного пациента без противопоказаний?',a:['Бисопролол','Атропин','Адреналин','Нитроглицерин'],c:0,e:'Бета-адреноблокаторы, например бисопролол, могут применяться для контроля ЧСС. Выбор зависит от гемодинамики, фракции выброса и сопутствующих состояний.'},
 {q:'Какой признак наиболее характерен для острого перикардита?',a:['Боль, усиливающаяся лёжа и уменьшающаяся при наклоне вперёд','Боль, возникающая только при надавливании на грудину','Безболевая желтуха','Изолированная боль в пояснице'],c:0,e:'Боль при остром перикардите часто плевритическая, усиливается лёжа и при глубоком вдохе, уменьшается в положении сидя с наклоном вперёд.'},
 {q:'Какой фактор риска является модифицируемым для атеросклеротических сердечно-сосудистых заболеваний?',a:['Возраст','Наследственность','Курение','Пол при рождении'],c:2,e:'Курение относится к модифицируемым факторам риска наряду с дислипидемией, артериальной гипертензией, диабетом и низкой физической активностью.'},
 {q:'Какой симптом наиболее типичен для внебольничной пневмонии?',a:['Кашель, лихорадка, одышка и локальные физикальные изменения','Изолированный зуд кожи','Безболевая макрогематурия','Приступы боли в правом подреберье после жирной пищи'],c:0,e:'Пневмония часто проявляется лихорадкой, кашлем, одышкой, болью в груди и локальными признаками уплотнения лёгочной ткани. Диагноз подтверждают визуализацией.'},
 {q:'Какой метод обычно подтверждает инфильтрацию лёгочной ткани при подозрении на пневмонию?',a:['Рентгенография органов грудной клетки','ЭКГ','ФГДС','УЗИ щитовидной железы'],c:0,e:'Рентгенография грудной клетки является стандартным методом визуализации инфильтрата при подозрении на пневмонию; в отдельных ситуациях применяют КТ или УЗИ лёгких.'},
 {q:'Какой возбудитель наиболее часто вызывает типичную внебольничную бактериальную пневмонию у взрослых?',a:['Streptococcus pneumoniae','Clostridium tetani','Vibrio cholerae','Neisseria gonorrhoeae'],c:0,e:'Streptococcus pneumoniae остаётся одним из наиболее частых бактериальных возбудителей внебольничной пневмонии у взрослых.'},
 {q:'Какой показатель спирометрии используют для подтверждения стойкой бронхиальной обструкции при ХОБЛ после бронходилататора?',a:['ОФВ1/ФЖЕЛ <0,70','ЖЕЛ >100% должного','Пиковая скорость выдоха >80%','ОФВ1/ФЖЕЛ >0,90'],c:0,e:'В диагностическом подходе GOLD стойкое постбронходилатационное отношение ОФВ1/ФЖЕЛ <0,70 подтверждает наличие обструкции в соответствующем клиническом контексте.'},
 {q:'Какой признак наиболее характерен для бронхиальной астмы?',a:['Вариабельные симптомы и вариабельное ограничение воздушного потока','Постоянная продуктивная мокрота более 10 лет у каждого пациента','Необратимая обструкция с рождения','Изолированная боль в плевре'],c:0,e:'Для астмы типичны вариабельные свистящие хрипы, одышка, стеснение в груди и кашель, а также вариабельность экспираторного воздушного потока.'},
 {q:'Какой препарат является базисным противовоспалительным средством при бронхиальной астме?',a:['Ингаляционный глюкокортикостероид','Короткодействующий β2-агонист в монотерапии','Муколитик','Антибиотик при каждом обострении'],c:0,e:'Ингаляционные глюкокортикостероиды являются основой противовоспалительной терапии астмы. Тактика и комбинации определяются ступенью лечения и актуальными рекомендациями.'},
 {q:'Какой газовый показатель наиболее важен для оценки вентиляционной недостаточности при тяжёлом обострении ХОБЛ?',a:['PaCO₂','Натрий мочи','Билирубин','Тропонин'],c:0,e:'Газовый состав артериальной крови позволяет оценить гипоксемию, гиперкапнию и кислотно-основное состояние.'},
 {q:'Какой симптом типичен для экссудативного плеврита?',a:['Ослабление дыхания и притупление перкуторного звука над выпотом','Коробочный звук над всей грудной клеткой','Громкое бронхиальное дыхание над нормальной лёгочной тканью','Изолированный стридор'],c:0,e:'Жидкость в плевральной полости вызывает притупление перкуторного звука и ослабление дыхания над зоной выпота.'},
 {q:'Какой клинический признак наиболее характерен для тромбоэмболии лёгочной артерии?',a:['Внезапная одышка, иногда плевритическая боль и тахикардия','Медленно нарастающая желтуха','Постепенное снижение слуха','Изолированная дизурия'],c:0,e:'ТЭЛА может проявляться внезапной одышкой, тахикардией, болью в груди, гипоксемией или синкопе. Клиническую вероятность оценивают по валидированным шкалам и обследованиям.'},
 {q:'Какой симптом наиболее характерен для гастроэзофагеальной рефлюксной болезни?',a:['Изжога и регургитация','Боль в правой подвздошной области','Кровохарканье','Полиурия'],c:0,e:'Типичные симптомы ГЭРБ — изжога и регургитация, часто усиливающиеся после еды или в положении лёжа.'},
 {q:'Какой тест используют для неинвазивного выявления активной инфекции Helicobacter pylori?',a:['13C-уреазный дыхательный тест','Антитела IgG как доказательство текущей инфекции','Общий анализ мочи','Проба Реберга'],c:0,e:'13C-уреазный дыхательный тест и антиген H. pylori в кале выявляют активную инфекцию. Серология не подходит для подтверждения эрадикации.'},
 {q:'Какой симптом наиболее характерен для язвенной болезни двенадцатиперстной кишки?',a:['Боль в эпигастрии натощак или ночью, иногда уменьшающаяся после еды','Боль исключительно при вдохе','Боль в пояснице с иррадиацией в пах','Безболевая желтуха'],c:0,e:'Для дуоденальной язвы классически описывают голодные и ночные боли, которые могут уменьшаться после приёма пищи или антацидов. Симптомы не обладают абсолютной специфичностью.'},
 {q:'Какой лабораторный показатель наиболее характерен для холестаза?',a:['Повышение щелочной фосфатазы и ГГТ','Изолированное снижение гемоглобина','Снижение креатинина','Повышение тропонина'],c:0,e:'При холестатическом типе поражения печени обычно повышаются щелочная фосфатаза и ГГТ; оценивают также билирубин и клинический контекст.'},
 {q:'Какой маркер наиболее специфичен для повреждения гепатоцитов?',a:['АЛТ','Калий','Кальций','Мочевина'],c:0,e:'АЛТ более специфична для повреждения гепатоцитов, чем АСТ, хотя интерпретировать трансаминазы следует вместе с другими показателями.'},
 {q:'Какой признак характерен для печёночной энцефалопатии?',a:['Изменение сознания и поведения, возможен астериксис','Изолированная боль в колене','Снижение остроты зрения только на один глаз','Положительный симптом Ласега'],c:0,e:'Печёночная энцефалопатия проявляется спектром нейропсихических нарушений от изменения сна и поведения до спутанности сознания и комы; возможен астериксис.'},
 {q:'Какой признак наиболее характерен для острого панкреатита?',a:['Постоянная интенсивная боль в эпигастрии с возможной иррадиацией в спину','Безболевая гематурия','Изолированная боль в правой голени','Кашель с мокротой'],c:0,e:'Типичная боль при остром панкреатите локализуется в эпигастрии, часто иррадиирует в спину и сопровождается тошнотой и рвотой.'},
 {q:'Какие два из трёх критериев используют для установления диагноза острого панкреатита?',a:['Типичная боль, липаза/амилаза ≥3 верхних границ нормы, характерная визуализация','Лихорадка, лейкопения, гипокалиемия','Желтуха, анемия, повышение ТТГ','Одышка, гипергликемия, протеинурия'],c:0,e:'Диагноз обычно устанавливают при наличии двух из трёх критериев: характерная боль, повышение липазы или амилазы не менее чем в 3 раза выше ВГН, типичные данные визуализации.'},
 {q:'Какой показатель используют для оценки фильтрационной функции почек в рутинной практике?',a:['Расчётная СКФ','АЛТ','С-реактивный белок','Амилаза'],c:0,e:'Расчётная скорость клубочковой фильтрации, обычно по креатинину с учётом возраста и пола, используется для оценки функции почек.'},
 {q:'Какой критерий соответствует хронической болезни почек?',a:['Признаки повреждения почек или СКФ <60 мл/мин/1,73 м², сохраняющиеся не менее 3 месяцев','Любое однократное повышение креатинина','Единичная лейкоцитурия после нагрузки','Отеки в течение двух дней'],c:0,e:'ХБП определяется структурными или функциональными аномалиями почек, имеющими значение для здоровья и сохраняющимися не менее 3 месяцев; один из критериев — СКФ <60 мл/мин/1,73 м².'},
 {q:'Какой симптом наиболее типичен для острого пиелонефрита?',a:['Лихорадка, боль в пояснице и болезненность при поколачивании','Изолированная изжога','Боль за грудиной при нагрузке','Сухость кожи без других проявлений'],c:0,e:'Острый пиелонефрит обычно сопровождается лихорадкой, ознобом, болью в боку/пояснице и симптомами инфекции мочевых путей.'},
 {q:'Какое изменение в анализе мочи наиболее характерно для нефротического синдрома?',a:['Выраженная протеинурия','Изолированная глюкозурия без гипергликемии','Отсутствие белка и эритроцитов','Только кетонурия'],c:0,e:'Нефротический синдром характеризуется массивной протеинурией, гипоальбуминемией, отёками и часто гиперлипидемией.'},
 {q:'Какое изменение электролитов наиболее опасно из-за риска нарушений сердечного ритма?',a:['Выраженная гиперкалиемия','Небольшое снижение хлора','Умеренное повышение фосфатов без симптомов','Изолированное повышение магния на минимальную величину'],c:0,e:'Гиперкалиемия может вызывать опасные нарушения проводимости и аритмии. При значимом повышении калия необходимы срочная оценка ЭКГ и неотложная медицинская помощь.'},
 {q:'Какой показатель наиболее характерен для первичного гипотиреоза?',a:['Повышенный ТТГ и сниженный свободный Т4','Сниженный ТТГ и повышенный свободный Т4','Нормальный ТТГ и резко повышенный Т3 во всех случаях','Повышенный кортизол'],c:0,e:'При явном первичном гипотиреозе функция щитовидной железы снижена: свободный Т4 низкий, а ТТГ повышен вследствие обратной связи.'},
 {q:'Какой лабораторный профиль характерен для первичного тиреотоксикоза?',a:['Сниженный ТТГ и повышенный свободный Т4 и/или Т3','Повышенный ТТГ и сниженный свободный Т4','Повышенный ТТГ и повышенный кальций как обязательный признак','Сниженный инсулин натощак'],c:0,e:'При первичном тиреотоксикозе избыток тиреоидных гормонов подавляет секрецию ТТГ гипофизом.'},
 {q:'Какой симптом типичен для тиреотоксикоза?',a:['Похудение, тахикардия, тремор и непереносимость жары','Зябкость, сонливость и прибавка массы тела','Выраженная брадикардия и сухость кожи','Периферические отёки как единственное проявление'],c:0,e:'Избыток тиреоидных гормонов усиливает обмен веществ и адренергические эффекты: возможны похудение, тахикардия, тремор, потливость и непереносимость жары.'},
 {q:'Какой критерий соответствует сахарному диабету по уровню глюкозы плазмы натощак?',a:['≥7,0 ммоль/л','≥5,0 ммоль/л','≥5,6 ммоль/л','≥6,0 ммоль/л'],c:0,e:'Диагностический критерий диабета — глюкоза венозной плазмы натощак ≥7,0 ммоль/л. При отсутствии явной симптомной гипергликемии результат обычно подтверждают повторным тестом.'},
 {q:'Какой показатель отражает среднюю гликемию примерно за последние 2–3 месяца?',a:['HbA1c','Однократная глюкоза мочи','С-пептид','Инсулин натощак'],c:0,e:'Гликированный гемоглобин HbA1c отражает средний уровень глюкозы за период жизни эритроцитов, приблизительно 2–3 месяца.'},
 {q:'Какой симптом наиболее характерен для гипогликемии?',a:['Потливость, дрожь, сердцебиение и возможное нарушение сознания','Постепенная желтуха без других симптомов','Изолированная боль в суставах','Сухой кашель после еды'],c:0,e:'Адренергические симптомы гипогликемии включают потливость, тремор, голод и сердцебиение; нейрогликопения может приводить к спутанности сознания и судорогам.'},
 {q:'Какой тип дыхания и кислотно-основного нарушения характерен для диабетического кетоацидоза?',a:['Метаболический ацидоз с компенсаторным глубоким дыханием Куссмауля','Метаболический алкалоз с поверхностным дыханием','Изолированный респираторный алкалоз без ацидоза','Нормальное КОС при обязательном кетозе'],c:0,e:'Накопление кетоновых тел вызывает метаболический ацидоз с увеличенной анионной разницей; компенсаторно возникает глубокое частое дыхание Куссмауля.'},
 {q:'Какой симптом наиболее характерен для железодефицитной анемии?',a:['Слабость, бледность, микроцитоз и снижение ферритина','Макроцитоз и высокий витамин B12','Изолированная тромбоцитопения','Повышение гемоглобина и гематокрита'],c:0,e:'Железодефицитная анемия обычно микроцитарная и гипохромная; ферритин снижен, хотя при воспалении он может быть ложно нормальным или повышенным.'},
 {q:'Какой лабораторный признак наиболее характерен для дефицита витамина B12?',a:['Макроцитарная анемия и возможные неврологические нарушения','Микроцитоз с низким ферритином во всех случаях','Изолированное повышение тромбоцитов','Выраженная эозинофилия'],c:0,e:'Дефицит B12 нарушает синтез ДНК и может вызывать мегалобластную макроцитарную анемию, глоссит и неврологические нарушения.'},

{q:'Какой признак наиболее характерен для периферического пареза лицевого нерва?',a:['Невозможность полностью закрыть глаз и сгладить носогубную складку на стороне поражения','Изолированное опущение угла рта при сохранном лбе','Двусторонняя потеря слуха','Нарушение движения языка без слабости мимики'],c:0,e:'При периферическом поражении VII нерва страдают мышцы всей половины лица, включая лобную мышцу и круговую мышцу глаза.'},
{q:'Какой симптом характерен для радикулопатии L5?',a:['Боль по наружной поверхности голени к тылу стопы, возможна слабость разгибания большого пальца','Боль только в затылке','Изолированная слабость жевательных мышц','Нарушение глотания'],c:0,e:'Поражение корешка L5 может вызывать боль по латеральной поверхности голени и тылу стопы, чувствительные нарушения и слабость разгибания большого пальца.'},
{q:'Какой признак наиболее типичен для миастении?',a:['Патологическая мышечная утомляемость, усиливающаяся при нагрузке','Постоянная спастичность с гиперрефлексией','Нарушение чувствительности по типу полинейропатии','Тремор покоя'],c:0,e:'Миастения вызывает флюктуирующую слабость скелетных мышц, усиливающуюся при повторной нагрузке и уменьшающуюся после отдыха.'},
{q:'Какой тип нарушения чувствительности характерен для полинейропатии?',a:['Дистальный симметричный тип «носков и перчаток»','Строго односторонняя гемигипестезия','Изолированная потеря зрения','Только чувствительность лица'],c:0,e:'Для многих длино-зависимых полинейропатий характерны симметричные дистальные чувствительные нарушения по типу «носков и перчаток».'},
{q:'Какой признак указывает на поражение пирамидного пути?',a:['Положительный симптом Бабинского','Снижение мышечного тонуса и арефлексия как постоянное сочетание','Изолированная гипосмия','Миоз'],c:0,e:'Поражение корково-спинномозгового пути может приводить к спастичности, повышению сухожильных рефлексов и патологическому разгибательному подошвенному рефлексу.'},
{q:'Какой симптом наиболее характерен для невралгии тройничного нерва?',a:['Кратковременные интенсивные приступы лицевой боли, провоцируемые прикосновением или жеванием','Постоянная двусторонняя тупая боль в затылке','Боль в пояснице при наклоне','Изолированная потеря вкуса'],c:0,e:'Классическая невралгия тройничного нерва проявляется краткими, очень интенсивными, электрическими болевыми пароксизмами в зоне одной или нескольких ветвей.'}
];

const subjects=[['Хирургия','20 вопросов в стартовом тесте','⚕','20','68'],['Терапия','50 вопросов по внутренним болезням','🫀','50','0'],['Педиатрия','Возрастные нормы и заболевания','🧸','10','0'],['Акушерство и гинекология','Беременность, роды, гинекология','♀','10','0'],['Инфекционные болезни','Этиология, патогенез, лечение','🦠','10','0'],['Неврология','Синдромы и топическая диагностика','🧠','10','0']];
let page='home',qIndex=0,selected=null,answers=[],showFeedback=false,quizMode='study',currentSubject='surgery',questionCount='all',quizQuestions=[];
let saved;
try{saved=JSON.parse(localStorage.getItem('medtrainer-data')||'null')||{attempts:0,correct:0,history:[]}}catch(e){saved={attempts:0,correct:0,history:[]}}
saved.history=Array.isArray(saved.history)?saved.history.map(h=>({...h,subject:h.subject||'surgery'})):[];
saved.attempts=Number(saved.attempts)||saved.history.length;
saved.correct=Number(saved.correct)||saved.history.reduce((n,h)=>n+(Number(h.correct)||0),0);
function activeQuestions(){return ({surgery:surgeryQuestions,therapy:therapyQuestions,pediatrics:pediatricsQuestions,obgyn:obgynQuestions,infectious:infectiousQuestions,neurology:neurologyQuestions})[currentSubject]||[]}
function subjectName(){return ({surgery:'Хирургия',therapy:'Терапия',pediatrics:'Педиатрия',obgyn:'Акушерство и гинекология',infectious:'Инфекционные болезни',neurology:'Неврология'})[currentSubject]||'Предмет'}
const main=document.getElementById('main');
function persist(){try{localStorage.setItem('medtrainer-data',JSON.stringify(saved));return true}catch(e){alert('Не удалось сохранить результат в этом браузере. Возможно, отключено хранилище или закончилось место.');return false}}
function shell(content){main.innerHTML=`<div class="mobile-brand"><div class="logo">+</div><strong>MedTrainer</strong></div><div class="topbar"><div class="crumb">MedTrainer <span style="color:#506176"> / </span> ${page==='home'?'Главная':page==='subjects'?'Предметы':page==='quiz'?subjectName()+' / Тест':page==='results'?'Мои результаты':'Результат'}</div><button class="profile" onclick="resultsPage()" style="border:0;background:transparent;color:inherit;cursor:pointer"><div class="avatar">М</div><span>Мой профиль</span></button></div>${content}`;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function home(){page='home';let last=saved.history.length?saved.history[saved.history.length-1]:null; shell(`<div class="hero"><div><div class="eyebrow">ТВОЯ УЧЕБНАЯ СРЕДА</div><h1>Знания, которые<br>помогают лечить.</h1><p>Тренируй клиническое мышление, проверяй знания и отслеживай прогресс в удобном темпе.</p></div><div class="hero-art">⚕</div></div><div class="stats"><div class="stat"><div class="stat-top">Пройдено тестов <span>▤</span></div><strong>${saved.attempts}</strong><small>всего попыток</small></div><div class="stat"><div class="stat-top">Правильных ответов <span>✓</span></div><strong>${saved.correct}</strong><small>за все попытки</small></div><div class="stat"><div class="stat-top">Последний результат <span>↗</span></div><strong>${last?Math.round(last.correct/last.total*100)+'%':'—'}</strong><small>${last?subjectLabel(last.subject):'пока нет попыток'}</small></div></div><div class="section-head"><div><h2>Выбери предмет</h2><p>Начни с нужной дисциплины</p></div><button class="text-btn" onclick="subjectsPage()">Все предметы →</button></div><div class="subjects">${subjects.slice(0,3).map((s,i)=>`<div class="card subject" onclick="${['surgery','therapy','pediatrics','obgyn','infectious','neurology'][i]?`startQuiz('${['surgery','therapy','pediatrics','obgyn','infectious','neurology'][i]}')`:'comingSoon()'}"><div class="subject-icon">${s[2]}</div><h3>${s[0]}</h3><p>${s[1]}</p><div class="subject-foot"><span>${i<3?'Доступно':'Скоро'}</span><span>${['20','50','10'][i]||'—'} вопросов</span></div><div class="progress"><span style="width:0%"></span></div></div>`).join('')}</div><div class="card continue"><div><h3>Продолжим подготовку?</h3><p>Выбери хирургию или терапию и пройди тест в удобном режиме.</p></div><button class="primary" onclick="startQuiz('therapy')">Терапия · 50 вопросов&nbsp; →</button></div>`)}
function subjectLabel(id){return ({surgery:'Хирургия',therapy:'Терапия',pediatrics:'Педиатрия',obgyn:'Акушерство и гинекология',infectious:'Инфекционные болезни',neurology:'Неврология'})[id]||'Предмет'}
function subjectsPage(){page='subjects';shell(`<div class="eyebrow">БИБЛИОТЕКА ДИСЦИПЛИН</div><h1 class="page-title">Предметы</h1><p class="muted" style="font-size:13px">Выбери дисциплину, чтобы перейти к тренировке.</p><div class="subject-list">${subjects.map((s,i)=>`<div class="card subject-row" onclick="${['surgery','therapy','pediatrics','obgyn','infectious','neurology'][i]?`startQuiz('${['surgery','therapy','pediatrics','obgyn','infectious','neurology'][i]}')`:'comingSoon()'}"><div class="subject-icon">${s[2]}</div><div><h3>${s[0]}</h3><p>${s[1]}</p></div><span class="arrow">${['20 вопросов','50 вопросов','10 вопросов','10 вопросов','10 вопросов','10 вопросов'][i]}　→</span></div>`).join('')}</div>`)}
function startQuiz(subject='surgery'){currentSubject=subject;page='mode';const total=activeQuestions().length;shell(`<div class="eyebrow">${subjectName().toUpperCase()} · ${total} ВОПРОСОВ</div><h1 class="page-title">Как будем тренироваться?</h1><p class="muted" style="font-size:13px;line-height:1.6">Выбери количество вопросов и формат прохождения.</p><div style="max-width:260px;margin:18px 0"><label style="display:block;color:var(--muted);font-size:11px;margin-bottom:7px">Количество вопросов</label><select id="questionCount" onchange="questionCount=this.value" style="width:100%;padding:12px;border-radius:10px;background:#182434;color:var(--text);border:1px solid var(--line)"><option value="10">10 вопросов</option><option value="20">20 вопросов</option><option value="50">50 вопросов</option><option value="all" selected>Все (${total})</option></select></div><div class="mode-grid"><button class="card mode-card" onclick="chooseMode('study')"><div class="mode-icon">📚</div><h3>Режим обучения</h3><p>После каждого ответа сразу увидишь, правильно ли ответил, и прочитаешь объяснение.</p><span class="mode-tag">С обратной связью</span></button><button class="card mode-card" onclick="chooseMode('exam')"><div class="mode-icon">⏱️</div><h3>Режим экзамена</h3><p>Без подсказок и объяснений во время теста. Итог и разбор — только после завершения.</p><span class="mode-tag">Проверка знаний</span></button></div><button class="secondary" style="margin-top:20px" onclick="home()">← Назад</button>`)}
function chooseMode(mode){quizMode=mode;qIndex=0;selected=null;answers=[];showFeedback=false;const bank=activeQuestions().slice().sort(()=>Math.random()-.5);const n=questionCount==='all'?bank.length:Math.min(Number(questionCount),bank.length);quizQuestions=bank.slice(0,n);quizPage()}
function quizPage(){page='quiz';const qs=quizQuestions,q=qs[qIndex],answered=selected!==null;let opts=q.a.map((a,i)=>`<button class="option ${answered&&i===q.c?'correct':answered&&i===selected?'wrong':''} ${!answered&&i===selected?'selected':''}" ${answered?'disabled':''} onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span>${a}</button>`).join('');shell(`<div class="quiz-wrap"><div class="eyebrow">${subjectName().toUpperCase()} · ${quizMode==='study'?'РЕЖИМ ОБУЧЕНИЯ':'РЕЖИМ ЭКЗАМЕНА'}</div><div class="quiz-tools"><span>${quizMode==='study'?'С объяснениями после ответа':'Без подсказок'}</span><span>Один правильный ответ</span></div><div class="quiz-head" style="margin-top:14px"><span>Вопрос ${qIndex+1} из ${qs.length}</span><span>${Math.round(qIndex/qs.length*100)}% пройдено</span></div><div class="quiz-progress"><span style="width:${qIndex/qs.length*100}%"></span></div><div class="card question-card"><div class="eyebrow">ОДИН ПРАВИЛЬНЫЙ ОТВЕТ</div><h2>${q.q}</h2>${opts}${answered&&quizMode==='study'?`<div class="feedback ${selected===q.c?'good':'bad'}"><b>${selected===q.c?'Верно!':'Не совсем.'}</b> ${q.e}</div>`:''}<div class="quiz-actions"><button class="secondary" onclick="quitQuiz()">Выйти из теста</button><button class="primary" ${answered?'':'disabled style="opacity:.45;cursor:not-allowed"'} onclick="nextQuestion()">${qIndex===qs.length-1?'Завершить':'Следующий вопрос'} →</button></div></div></div>`)}
function choose(i){if(selected!==null)return;selected=i;answers.push(i);quizPage()}
function nextQuestion(){if(selected===null)return;const qs=quizQuestions;if(qIndex<qs.length-1){qIndex++;selected=null;quizPage()}else finishQuiz()}
function finishQuiz(){const qs=quizQuestions,correct=answers.reduce((n,a,i)=>n+(a===qs[i].c?1:0),0);saved.attempts++;saved.correct+=correct;saved.history.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),date:new Date().toISOString(),correct,total:qs.length,subject:currentSubject,mode:quizMode,details:qs.map((q,i)=>({q:q.q,options:q.a,chosen:answers[i],correctIndex:q.c,explanation:q.e}))});persist();page='result';shell(`<div class="quiz-wrap card result"><div class="eyebrow">ТЕСТ ЗАВЕРШЁН · ${subjectName().toUpperCase()}</div><div class="score-ring"><strong>${Math.round(correct/qs.length*100)}%</strong></div><h2>${correct>=Math.ceil(qs.length*.8)?'Отличный результат!':correct>=Math.ceil(qs.length*.6)?'Хорошая работа!':'Есть над чем поработать'}</h2><p>Ты завершил тест по предмету «${subjectName()}».</p><div class="result-grid"><div><b>${correct}</b><small>Правильно</small></div><div><b>${qs.length-correct}</b><small>Ошибки</small></div><div><b>${qs.length}</b><small>Всего</small></div></div><button class="primary" onclick="reviewAnswers()">Разобрать ответы</button> <button class="secondary" onclick="home()">На главную</button></div>`)}
function reviewAnswers(){const qs=quizQuestions;page='review';shell(`<div class="eyebrow">РАЗБОР РЕЗУЛЬТАТОВ · ${subjectName().toUpperCase()}</div><h1 class="page-title">Твои ответы</h1><p class="muted" style="font-size:13px">Правильные варианты и короткие пояснения.</p><div style="display:grid;gap:12px;margin-top:22px">${qs.map((q,i)=>`<div class="card" style="padding:17px"><div class="eyebrow" style="font-size:9px">ВОПРОС ${i+1} · ${answers[i]===q.c?'<span style="color:var(--accent)">ВЕРНО</span>':'<span style="color:var(--red)">ОШИБКА</span>'}</div><h3 style="font-size:13px;line-height:1.5">${q.q}</h3><p style="font-size:11px;color:var(--muted)">Твой ответ: ${q.a[answers[i]]}</p><p style="font-size:11px;color:var(--accent)">Правильный ответ: ${q.a[q.c]}</p><p style="font-size:11px;line-height:1.6;color:#aebdce">${q.e}</p></div>`).join('')}</div><button class="primary" style="margin-top:20px" onclick="startQuiz('${currentSubject}')">Пройти ещё раз</button>`)}
function reviewSavedAttempt(id){const h=saved.history.find(x=>x.id===id);if(!h||!Array.isArray(h.details)){alert('Подробный разбор для этой старой попытки не сохранён. Новые результаты будут содержать ответы и пояснения.');return}page='review';shell(`<div class="eyebrow">СОХРАНЁННЫЙ РЕЗУЛЬТАТ · ${subjectLabel(h.subject).toUpperCase()}</div><h1 class="page-title">Разбор попытки</h1><p class="muted" style="font-size:12px">${new Date(h.date).toLocaleString('ru-RU')} · ${h.correct}/${h.total} правильных · ${h.mode==='exam'?'Экзамен':'Обучение'}</p><div style="display:grid;gap:12px;margin-top:22px">${h.details.map((d,i)=>`<div class="card" style="padding:17px"><div class="eyebrow" style="font-size:9px">ВОПРОС ${i+1} · ${d.chosen===d.correctIndex?'<span style=\"color:var(--accent)\">ВЕРНО</span>':'<span style=\"color:var(--red)\">ОШИБКА</span>'}</div><h3 style="font-size:13px;line-height:1.5">${d.q}</h3><p style="font-size:11px;color:var(--muted)">Твой ответ: ${d.options[d.chosen]??'Нет ответа'}</p><p style="font-size:11px;color:var(--accent)">Правильный ответ: ${d.options[d.correctIndex]}</p><p style="font-size:11px;line-height:1.6;color:#aebdce">${d.explanation||''}</p></div>`).join('')}</div><button class="secondary" style="margin-top:20px" onclick="resultsPage()">← Назад к профилю</button>`)}
function resultsPage(){page='results';const subjectStats=[['surgery','Хирургия','⚕'],['therapy','Терапия','🫀'],['pediatrics','Педиатрия','🧸'],['obgyn','Акушерство и гинекология','♀'],['infectious','Инфекционные болезни','🦠'],['neurology','Неврология','🧠']].map(([id,name,icon])=>[id,name,icon,saved.history.filter(h=>h.subject===id)]);const sum=arr=>({attempts:arr.length,correct:arr.reduce((n,h)=>n+h.correct,0),last:arr[arr.length-1]});shell(`<div class="eyebrow">ТВОЯ СТАТИСТИКА</div><h1 class="page-title">Мои результаты</h1><div class="stats"><div class="stat"><div class="stat-top">Все попытки</div><strong>${saved.attempts}</strong><small>по всем предметам</small></div><div class="stat"><div class="stat-top">Верных ответов</div><strong>${saved.correct}</strong><small>суммарно</small></div><div class="stat"><div class="stat-top">Последний тест</div><strong>${saved.history.length?Math.round(saved.history[saved.history.length-1].correct/saved.history[saved.history.length-1].total*100)+'%':'—'}</strong><small>${saved.history.length?subjectLabel(saved.history[saved.history.length-1].subject):'пока нет попыток'}</small></div></div><div class="section-head"><div><h2>Статистика по предметам</h2><p>Результаты каждой дисциплины учитываются отдельно</p></div></div><div class="subject-list">${subjectStats.map(([id,name,icon,arr])=>{const st=sum(arr);return `<div class="card" style="padding:18px"><div class="subject-icon">${icon}</div><h3 style="font-size:14px">${name}</h3><p class="muted" style="font-size:11px">Попыток: ${st.attempts} · Верных ответов: ${st.correct}</p><p class="muted" style="font-size:11px">Последний результат: ${st.last?st.last.correct+'/'+st.last.total+' · '+Math.round(st.last.correct/st.last.total*100)+'%':'пока нет попыток'}</p><button class="secondary" onclick="startQuiz('${id}')">Начать тест →</button></div>`}).join('')}</div><div class="section-head" style="margin-top:28px"><div><h2>История попыток</h2><p>История и разборы сохраняются в этом браузере на устройстве</p></div></div>${saved.history.length?saved.history.slice().reverse().map(h=>`<div class="card" style="padding:16px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b style="font-size:13px">${subjectLabel(h.subject)}</b><div class="muted" style="font-size:10px;margin-top:5px">${new Date(h.date).toLocaleString('ru-RU')} · ${h.mode==='exam'?'Экзамен':'Обучение'}</div></div><div style="display:flex;align-items:center;gap:12px"><b style="color:var(--accent);white-space:nowrap">${h.correct}/${h.total} · ${Math.round(h.correct/h.total*100)}%</b>${h.details?`<button class="secondary" onclick="reviewSavedAttempt('${h.id}')">Разбор</button>`:''}</div></div>`).join(''):'<div class="card empty">Ты пока не проходил тесты. Начни с хирургии или терапии.</div>'}`)}
function comingSoon(){alert('Этот раздел появится в следующих версиях MedTrainer.')}
function quitQuiz(){if(confirm('Выйти из теста? Текущая попытка не будет сохранена.'))home()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.page==='home')home();if(b.dataset.page==='subjects')subjectsPage();if(b.dataset.page==='results')resultsPage()}));
home();
</script>
</body>
</html>
